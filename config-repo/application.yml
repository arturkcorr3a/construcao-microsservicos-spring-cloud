# Configuracao compartilhada por todos os clientes do Config Server
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

spring:
  datasource:
    url: jdbc:h2:mem:${spring.application.name};DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

# Metricas para o Prometheus (GET /actuator/prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
